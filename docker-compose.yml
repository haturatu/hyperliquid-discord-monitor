services:
  hyperliquid-monitor:
    build: .
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: Asia/Tokyo
      DB_DIRECTORY: ./data
    volumes:
      - monitor-data:/app/data
      - ./addresses.txt:/app/addresses.txt:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      # Updated by monitor loop even if no fills arrive.
      test:
        - CMD
        - python
        - -c
        - "import os,time; from pathlib import Path; p=Path(os.getenv('HEALTHCHECK_FILE', '/tmp/healthcheck.txt')); assert p.is_file() and 0 <= time.time()-p.stat().st_mtime < 120"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  monitor-data:
